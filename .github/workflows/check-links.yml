name: Check links

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 03:17 UTC
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in HTML and data
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --exclude "linkedin\.com"
            --exclude "instagram\.com"
            --exclude "facebook\.com"
            --exclude "twitter\.com"
            --exclude "formsubmit\.co"
            --exclude "gc\.zgo\.at"
            "./**/*.html" "./data/*.json"
          fail: true
