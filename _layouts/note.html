<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Imtiaz Hussain</title>
<meta name="description" content="{{ page.summary }}">
<link rel="icon" href="/assets/img/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  .post{max-width:760px;margin:0 auto;padding:64px clamp(16px,4vw,40px) 96px}
  .post h1{font-size:clamp(30px,4vw,44px);margin:8px 0 12px}
  .post .meta{color:var(--gold-ink);font-weight:700}
  .post-body{font-size:18px;line-height:1.75}
  .post-body h2{font-size:24px;margin:36px 0 10px}
  .post-body img{border-radius:10px}
  .post-body pre{overflow-x:auto;background:var(--bg2);padding:16px;border-radius:8px}
</style>
</head>
<body>
<header class="nav"><nav class="wrap nav-in"><a class="brand" href="/">Imtiaz Hussain</a><a class="nl" href="/#notes">← All notes</a></nav></header>
<main class="post">
  <p class="meta">{{ page.date | date: "%d %b %Y" }}</p>
  <h1>{{ page.title }}</h1>
  <div class="post-body">{{ content }}</div>
</main>
</body>
</html>
